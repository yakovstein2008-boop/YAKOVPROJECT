<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הלוז שלי">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>הלוז שלי</title>
<style>
  :root {
    --bg: #0f1b2d; --card: #1a2a42; --line: #2b3f5e; --text: #eef3fb; --muted: #93a4bf;
    --gold: #ffd166; --good: #3ddc97; --bad: #ff6b6b; --accent: #4ea8de;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(80px + env(safe-area-inset-bottom));
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 22px; margin: 18px 0 4px; }
  h2 { font-size: 17px; margin: 22px 0 10px; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .stat { background: var(--card); border-radius: 14px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 24px; color: var(--gold); }
  .stat span { font-size: 12px; color: var(--muted); }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); transition: width .3s; }
  .task {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border-radius: 14px; padding: 14px; margin-bottom: 8px; border: 2px solid transparent;
  }
  .task.done { opacity: .55; }
  .task.done .name { text-decoration: line-through; }
  .task.now { border-color: var(--accent); }
  .task.late { border-color: var(--bad); }
  .task .time { font-variant-numeric: tabular-nums; color: var(--muted); width: 44px; font-size: 15px; }
  .task .name { flex: 1; font-size: 17px; }
  .task .pts { font-size: 13px; color: var(--gold); }
  .check {
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--muted);
    background: none; color: var(--bg); font-size: 20px; flex-shrink: 0;
  }
  .done .check { background: var(--good); border-color: var(--good); }
  .penalty { background: #3a1f28; border: 2px solid var(--bad); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .penalty b { color: var(--bad); }
  .msg { background: #1f3a2f; border: 2px solid var(--good); border-radius: 14px; padding: 14px; margin: 12px 0; }
  button.btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 12px 16px; font-size: 16px; font-family: inherit; width: 100%; margin-top: 8px;
  }
  button.btn.ghost { background: var(--card); border: 1px solid var(--line); }
  button.small { width: auto; padding: 8px 12px; font-size: 14px; margin: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px; font-size: 16px; font-family: inherit;
  }
  input[type=time] { width: 135px; }
  input[type=number] { width: 70px; }
  textarea { width: 100%; min-height: 110px; }
  .edit { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
  .edit .name-in { flex: 1; min-width: 140px; }
  .days { display: flex; gap: 4px; margin-top: 8px; }
  .days label {
    flex: 1; text-align: center; padding: 6px 0; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--line); font-size: 14px;
  }
  .days input { display: none; }
  .days label:has(input:checked) { background: var(--accent); border-color: var(--accent); }
  .reward { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
  .reward .name { flex: 1; }
  .hist { display: flex; gap: 4px; flex-wrap: wrap; }
  .hist div { width: 26px; height: 26px; border-radius: 6px; background: var(--line); font-size: 11px; display: grid; place-items: center; }
  .hist .ok { background: var(--good); color: var(--bg); }
  .hist .fail { background: var(--bad); }
  nav {
    position: fixed; bottom: 0; inset-inline: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: 0; color: var(--muted); padding: 12px 0 10px;
    font-size: 13px; font-family: inherit;
  }
  nav button b { display: block; font-size: 22px; }
  nav button.on { color: var(--gold); }
  .hidden { display: none; }
  .toast {
    position: fixed; top: 20px; inset-inline: 16px; background: var(--gold); color: #222;
    padding: 14px; border-radius: 14px; text-align: center; font-weight: 600; z-index: 9;
    max-width: 528px; margin-inline: auto;
  }
</style>
</head>
<body>

<section id="tab-today"></section>
<section id="tab-rewards" class="hidden"></section>
<section id="tab-settings" class="hidden"></section>

<nav>
  <button data-tab="today" class="on"><b>📋</b>היום</button>
  <button data-tab="rewards"><b>🏆</b>פרסים</button>
  <button data-tab="settings"><b>⚙️</b>הגדרות</button>
</nav>

<script>
// ---------- Defaults ----------
const DAY_NAMES = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
const STUDY = [0, 1, 2, 3, 4];   // Sunday–Thursday: full mechina day
const ALL = [0, 1, 2, 3, 4, 5];  // Sunday–Friday; Shabbat is a rest day
const FRIDAY = [5];

const SCHEDULE_VERSION = 2;
const DEFAULT_TASKS = [
  { name: '⏰ קימה: לסדר חדר, שיניים, להתלבש', time: '07:00', points: 20, days: ALL },
  { name: '🙏 שחרית',                         time: '07:15', points: 25, days: ALL },
  { name: '🍳 ארוחת בוקר נורמלית',            time: '08:00', points: 10, days: ALL },
  { name: '📖 סדר הלכה',                      time: '08:15', points: 10, days: STUDY },
  { name: '🎓 שיעור בוקר',                    time: '09:00', points: 10, days: STUDY },
  { name: '📚 סדר בוקר – חברותא',             time: '09:30', points: 15, days: STUDY },
  { name: '🧠 שיעור עיון',                    time: '12:00', points: 10, days: STUDY },
  { name: '🍽️ ארוחת צהריים נורמלית',         time: '13:00', points: 10, days: STUDY },
  { name: '📕 לקרוא 20 דקות',                 time: '13:30', points: 5,  days: STUDY },
  { name: '👥 נדב – נתיבות שלום',             time: '15:00', points: 10, days: STUDY },
  { name: '🙏 מנחה',                          time: '15:15', points: 10, days: STUDY },
  { name: '👥 אשל – נצח ישראל',               time: '15:30', points: 10, days: STUDY },
  { name: '👥 גל – מורה נבוכים',              time: '16:30', points: 10, days: STUDY },
  { name: '👥 אדלר – סוכה',                   time: '17:30', points: 10, days: STUDY },
  { name: '🎓 שיעור ערב',                     time: '18:15', points: 10, days: STUDY },
  { name: '🍲 ארוחת ערב',                     time: '19:30', points: 10, days: STUDY },
  { name: '🎸 נגינה',                         time: '20:15', points: 5,  days: STUDY },
  { name: '🙏 ערבית',                         time: '20:45', points: 10, days: STUDY },
  { name: '👥 גרוסי – עבודה זרה',             time: '21:00', points: 10, days: STUDY },
  { name: '💪 שיעור ערב שני / אימון / ריצה',  time: '22:00', points: 15, days: STUDY },
  { name: '🚿 מקלחת',                         time: '23:15', points: 5,  days: STUDY },
  { name: '😴 לישון',                         time: '23:45', points: 15, days: STUDY },
  { name: '🧹 לסדר את החדר לשבת',             time: '12:00', points: 15, days: FRIDAY },
].map((t, i) => ({ id: 't' + i, ...t }));

const DEFAULT_REWARDS = [
  { name: '🍫 משהו מתוק מהמכולת', cost: 100 },
  { name: '🎮 שעה חופשית בלי רגשות אשמה', cost: 200 },
  { name: '🍕 פיצה בסופ"ש', cost: 500 },
];

const DEFAULT_PENALTIES = [
  '30 שכיבות סמיכה',
  '50 כפיפות בטן',
  'ריצה נוספת של 2 ק"מ',
  'שבוע בלי סוכר מהמכולת',
  'לנקות את השירותים בחדר',
  '3 דקות פלאנק (אפשר לחלק)',
];

const LATE_GRACE_MIN = 45;   // done within 45 min of the time = on time, full points
const DAY_BONUS = 20;        // finishing every task of the day
const DAY_START_H = 3;       // the day rolls over at 03:00, so going to sleep at 23:45 still counts for today

// ---------- State ----------
const KEY = 'luz-state-v1';
let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) {
      if (s.scheduleVersion !== SCHEDULE_VERSION) { s.tasks = DEFAULT_TASKS; s.scheduleVersion = SCHEDULE_VERSION; }
      return s;
    }
  } catch (e) {}
  return {
    tasks: DEFAULT_TASKS, rewards: DEFAULT_REWARDS, penaltyList: DEFAULT_PENALTIES,
    points: 0, streak: 0, bestStreak: 0,
    days: {},          // 'YYYY-MM-DD' -> { done: {taskId: points}, result: 'ok'|'fail' }
    penalties: [],     // { text, date, done }
    lastEval: dateKey(addDays(today(), -1)),
    notified: {}, scheduleVersion: SCHEDULE_VERSION,
  };
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

// ---------- Date helpers ----------
function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function minutesOf(hhmm) { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }
// The "app day" starts at DAY_START_H, so 00:30 still belongs to yesterday's schedule
function today() { return new Date(Date.now() - DAY_START_H * 3600e3); }
function nowMinutes() {
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  return m < DAY_START_H * 60 ? m + 1440 : m;
}
function tasksFor(date) {
  return state.tasks.filter(t => t.days.includes(date.getDay()))
    .sort((a, b) => minutesOf(a.time) - minutesOf(b.time));
}
function dayRec(key) { return state.days[key] || (state.days[key] = { done: {} }); }

// ---------- End-of-day judgement: reward or punish every day that has passed ----------
let report = [];
function evaluatePastDays() {
  const yesterday = dateKey(addDays(today(), -1));
  let d = addDays(parseKey(state.lastEval), 1);
  while (dateKey(d) <= yesterday) {
    const key = dateKey(d);
    const tasks = tasksFor(d);
    if (tasks.length) {
      const rec = dayRec(key);
      const missed = tasks.filter(t => !(t.id in rec.done));
      if (missed.length === 0) {
        state.streak++;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        const bonus = DAY_BONUS + Math.min(state.streak * 2, 30);
        state.points += bonus;
        rec.result = 'ok';
        report.push(`✅ ${key}: עשית הכל! +${bonus} נקודות. רצף: ${state.streak} ימים 🔥`);
      } else {
        const lost = missed.reduce((sum, t) => sum + t.points, 0);
        state.points = Math.max(0, state.points - lost);
        state.streak = 0;
        rec.result = 'fail';
        const p = state.penaltyList[Math.floor(Math.random() * state.penaltyList.length)];
        if (p && state.penalties.filter(x => !x.done).length < 3) {
          state.penalties.push({ text: p, date: key, done: false });
        }
        report.push(`❌ ${key}: פספסת ${missed.length} (${missed.map(t => t.name).join(', ')}). −${lost} נקודות, הרצף התאפס.`);
      }
    }
    d = addDays(d, 1);
  }
  state.lastEval = yesterday;
  save();
}

// ---------- Actions ----------
function toggle(id) {
  const key = dateKey(today());
  const rec = dayRec(key);
  const task = state.tasks.find(t => t.id === id);
  if (id in rec.done) {
    state.points = Math.max(0, state.points - rec.done[id]);
    delete rec.done[id];
  } else {
    const late = nowMinutes() > minutesOf(task.time) + LATE_GRACE_MIN;
    const pts = late ? Math.ceil(task.points / 2) : task.points;
    rec.done[id] = pts;
    state.points += pts;
    const all = tasksFor(today()).every(t => t.id in rec.done);
    toast(all ? '🎉 סיימת את כל המשימות של היום! הבונוס מגיע בחצות'
              : late ? `+${pts} (חצי נקודות — באיחור)` : `+${pts} נקודות 💪`);
  }
  save(); render();
}

function finishPenalty(i) {
  state.penalties[i].done = true;
  save(); toast('כל הכבוד, העונש שולם. החנות פתוחה שוב'); render();
}

function buy(i) {
  const r = state.rewards[i];
  if (state.penalties.some(p => !p.done)) return toast('🔒 קודם לסיים את העונש');
  if (state.points < r.cost) return toast(`חסרות לך ${r.cost - state.points} נקודות`);
  if (!confirm(`לממש "${r.name}" ב-${r.cost} נקודות?`)) return;
  state.points -= r.cost;
  save(); toast(`תהנה! ${r.name}`); render();
}

// ---------- Reminders (while the app is open or in the background) ----------
async function notify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const reg = await navigator.serviceWorker?.getRegistration();
  if (reg) reg.showNotification(title, { body, icon: 'icon-192.png', tag: title });
  else new Notification(title, { body });
}
function checkReminders() {
  const now = today(), key = dateKey(now), rec = dayRec(key), m = nowMinutes();
  for (const t of tasksFor(now)) {
    if (t.id in rec.done) continue;
    const start = minutesOf(t.time);
    const tag1 = key + t.id, tag2 = key + t.id + 'late';
    if (m >= start && m < start + LATE_GRACE_MIN && !state.notified[tag1]) {
      state.notified[tag1] = 1; notify(t.name, 'הגיע הזמן! לסמן כשסיימת ✅');
    }
    if (m >= start + 20 && m < start + LATE_GRACE_MIN && !state.notified[tag2]) {
      state.notified[tag2] = 1; notify('⏰ ' + t.name, `עוד ${start + LATE_GRACE_MIN - m} דקות עד שזה נחשב איחור`);
    }
  }
  // forget old notification marks
  for (const k in state.notified) if (!k.startsWith(key)) delete state.notified[k];
  save();
}

// ---------- Calendar export: reliable phone alarms even when the app is closed ----------
function exportCalendar() {
  const byday = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const start = dateKey(today()).replaceAll('-', '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//luz//he', 'CALSCALE:GREGORIAN'];
  for (const t of state.tasks) {
    if (!t.days.length) continue;
    const hm = t.time.replace(':', '') + '00';
    lines.push('BEGIN:VEVENT', `UID:luz-${t.id}-${Date.now()}@luz`,
      `DTSTART:${start}T${hm}`, 'DURATION:PT15M',
      `RRULE:FREQ=WEEKLY;BYDAY=${t.days.map(d => byday[d]).join(',')}`,
      `SUMMARY:${t.name}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${t.name}`, 'TRIGGER:PT0M', 'END:VALARM',
      'END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'luz.ics'; a.click();
}

// ---------- Rendering ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderToday() {
  const now = today(), rec = dayRec(dateKey(now)), m = nowMinutes();
  const tasks = tasksFor(now);
  const doneCount = tasks.filter(t => t.id in rec.done).length;
  const pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 100;
  const openPen = state.penalties.map((p, i) => ({ ...p, i })).filter(p => !p.done);
  const greeting = m < 5 * 60 || m >= 24 * 60 ? 'לילה טוב' : m < 12 * 60 ? 'בוקר טוב' : m < 18 * 60 ? 'צהריים טובים' : 'ערב טוב';

  let html = `<h1>${greeting} 👋</h1>
    <div class="sub">${now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
    <div class="stats">
      <div class="stat"><b>${state.points}</b><span>נקודות</span></div>
      <div class="stat"><b>${state.streak}🔥</b><span>רצף ימים</span></div>
      <div class="stat"><b>${doneCount}/${tasks.length}</b><span>היום</span></div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;

  html += report.map(r => `<div class="${r.startsWith('✅') ? 'msg' : 'penalty'}">${esc(r)}</div>`).join('');

  for (const p of openPen) {
    html += `<div class="penalty"><b>⚠️ עונש על ${esc(p.date)}:</b> ${esc(p.text)}
      <div class="sub">עד שלא תסיים את העונש — חנות הפרסים נעולה.</div>
      <button class="btn" onclick="finishPenalty(${p.i})">עשיתי את העונש</button></div>`;
  }

  if (!tasks.length) html += `<div class="msg">שבת שלום! היום אין משימות 🕯️</div>`;
  else html += '<h2>הלוז להיום</h2>';

  let nowMarked = false;
  for (const t of tasks) {
    const done = t.id in rec.done;
    const start = minutesOf(t.time);
    let cls = done ? 'done' : '';
    if (!done && m > start + LATE_GRACE_MIN) cls = 'late';
    else if (!done && !nowMarked && m >= start - 30) { cls = 'now'; nowMarked = true; }
    html += `<div class="task ${cls}" onclick="toggle('${t.id}')">
      <button class="check">${done ? '✓' : ''}</button>
      <div class="name">${esc(t.name)}</div>
      <div><div class="time">${t.time}</div><div class="pts">${done ? '+' + rec.done[t.id] : t.points} נק'</div></div>
    </div>`;
  }

  if ('Notification' in window && Notification.permission !== 'granted') {
    html += `<button class="btn" onclick="askNotify()">🔔 להפעיל התראות</button>`;
  }
  $('tab-today').innerHTML = html;
}

function renderRewards() {
  const locked = state.penalties.some(p => !p.done);
  let html = `<h1>🏆 פרסים</h1>
    <div class="sub">יש לך <b style="color:var(--gold)">${state.points}</b> נקודות · שיא רצף: ${state.bestStreak} ימים</div>
    ${locked ? '<div class="penalty">🔒 החנות נעולה עד שתסיים את העונש</div>' : ''}
    <h2>לקנות פרס</h2>`;
  state.rewards.forEach((r, i) => {
    html += `<div class="reward"><div class="name">${esc(r.name)}</div>
      <button class="btn small ${state.points < r.cost || locked ? 'ghost' : ''}" onclick="buy(${i})">${r.cost} נק'</button></div>`;
  });

  html += '<h2>30 הימים האחרונים</h2><div class="hist">';
  for (let i = 30; i >= 1; i--) {
    const d = addDays(today(), -i), r = state.days[dateKey(d)]?.result;
    html += `<div class="${r === 'ok' ? 'ok' : r === 'fail' ? 'fail' : ''}">${d.getDate()}</div>`;
  }
  html += `</div>
    <h2>איך זה עובד</h2>
    <div class="sub" style="line-height:1.7">
      ✅ משימה בזמן (עד ${LATE_GRACE_MIN} דק' אחרי השעה) = נקודות מלאות. באיחור = חצי.<br>
      🔥 יום שלם בלי פספוס = בונוס ${DAY_BONUS} + עוד 2 על כל יום ברצף.<br>
      ❌ כל משימה שפוספסה = מפסידים את הנקודות שלה, הרצף מתאפס, ומקבלים עונש.<br>
      🔒 עונש פתוח נועל את חנות הפרסים עד שמבצעים אותו.<br>
      🕯️ בשבת אין משימות — הרצף לא נשבר.
    </div>`;
  $('tab-rewards').innerHTML = html;
}

function renderSettings() {
  let html = `<h1>⚙️ הגדרות</h1>
    <h2>🔔 תזכורות שעובדות גם כשהאפליקציה סגורה</h2>
    <div class="sub">מוסיף את כל הלוז ליומן של הטלפון עם התראה בכל משימה. אחרי שינוי בלוז — למחוק את האירועים הישנים מהיומן ולייצא שוב.</div>
    <button class="btn" onclick="exportCalendar()">📅 להוסיף את הלוז ליומן</button>
    <h2>המשימות שלי</h2>`;
  state.tasks.forEach((t, i) => {
    html += `<div class="edit">
      <div class="row">
        <input class="name-in" value="${esc(t.name)}" onchange="setTask(${i},'name',this.value)">
        <button class="btn small ghost" onclick="delTask(${i})">🗑️</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input type="time" value="${t.time}" onchange="setTask(${i},'time',this.value)">
        <input type="number" min="1" value="${t.points}" onchange="setTask(${i},'points',+this.value)"> נקודות
      </div>
      <div class="days">${DAY_NAMES.map((n, d) =>
        `<label><input type="checkbox" ${t.days.includes(d) ? 'checked' : ''} onchange="setDay(${i},${d},this.checked)">${n}</label>`).join('')}</div>
    </div>`;
  });
  html += `<button class="btn ghost" onclick="addTask()">➕ משימה חדשה</button>
    <h2>פרסים</h2>`;
  state.rewards.forEach((r, i) => {
    html += `<div class="edit row">
      <input class="name-in" value="${esc(r.name)}" onchange="state.rewards[${i}].name=this.value;save()">
      <input type="number" min="1" value="${r.cost}" onchange="state.rewards[${i}].cost=+this.value;save()">
      <button class="btn small ghost" onclick="state.rewards.splice(${i},1);save();render()">🗑️</button>
    </div>`;
  });
  html += `<button class="btn ghost" onclick="state.rewards.push({name:'פרס חדש',cost:100});save();render()">➕ פרס חדש</button>
    <h2>רשימת עונשים (אחד בכל שורה, נבחר באקראי)</h2>
    <textarea onchange="state.penaltyList=this.value.split('\\n').map(s=>s.trim()).filter(Boolean);save()">${esc(state.penaltyList.join('\n'))}</textarea>
    <h2>איפוס</h2>
    <button class="btn ghost" onclick="if(confirm('למחוק הכל ולהתחיל מחדש?')){localStorage.removeItem(KEY);location.reload()}">🔄 להתחיל מאפס</button>`;
  $('tab-settings').innerHTML = html;
}

function setTask(i, field, val) { state.tasks[i][field] = val; save(); }
function setDay(i, d, on) {
  const days = new Set(state.tasks[i].days);
  on ? days.add(d) : days.delete(d);
  state.tasks[i].days = [...days].sort();
  save();
}
function delTask(i) { if (confirm(`למחוק את "${state.tasks[i].name}"?`)) { state.tasks.splice(i, 1); save(); render(); } }
function addTask() {
  state.tasks.push({ id: 't' + Date.now(), name: 'משימה חדשה', time: '12:00', points: 10, days: [...STUDY] });
  save(); render();
}

let currentTab = 'today';
function render() {
  if (currentTab === 'today') renderToday();
  if (currentTab === 'rewards') renderRewards();
  if (currentTab === 'settings') renderSettings();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  currentTab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + currentTab));
  report = [];
  render();
});

let toastTimer;
function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2500);
}

async function askNotify() {
  const r = await Notification.requestPermission();
  toast(r === 'granted' ? 'התראות הופעלו 🔔' : 'ההתראות חסומות — אפשר לאשר בהגדרות הטלפון');
  render();
}

// ---------- Start ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
evaluatePastDays();
render();
checkReminders();
setInterval(() => {
  evaluatePastDays();
  checkReminders();
  if (currentTab === 'today') renderToday();
}, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { evaluatePastDays(); render(); checkReminders(); }
});
</script>
</body>
</html>
